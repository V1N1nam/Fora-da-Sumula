<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fora da Súmula — gerador de imagens (uso interno)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --f-sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --bg:#F1F2EF; --surface:#FFFFFF; --surface-2:#F8F9F6; --surface-3:#EAECE7;
  --line:#E2E5DF; --line-2:#CBD0C8;
  --ink:#13161A; --ink-2:#4B545A; --ink-3:#646B71; --ink-4:#7C858B;
  --accent:#0D6A50; --accent-soft:#E1EFE9;
  --blue:#2A5E9E; --blue-soft:#E3EAF4;
  --red:#BC3A2B; --red-soft:#F7E6E3;
  --amber:#8F6410; --amber-soft:#F4EDDB;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:18px;font-weight:700;margin-bottom:2px}
.sub{color:var(--ink-3);font-size:13px;margin-bottom:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px;
  display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em}
select{font:inherit;font-size:14px;padding:9px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);min-width:200px}
.btn{font:inherit;font-size:14px;font-weight:600;padding:10px 18px;border-radius:8px;border:none;
  background:var(--accent);color:#fff;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:var(--surface-3);color:var(--ink)}
.stagearea{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.stage{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px;flex:1;min-width:320px}
.stage .cardbox{width:100%;aspect-ratio:1200/675;border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15);background:#F1F2EF}
.stage .cardbox svg{width:100%;height:100%;display:block}
.meta{margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.dlpreview{max-width:340px}
.dlpreview img{width:100%;border-radius:6px;border:1px solid var(--line)}
.note{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gerador de imagens — export para X</h1>
  <div class="sub">Ferramenta de uso interno. Não linkada no site público, não indexada. Formato fixo: 1200×675px (16:9), exportado em 2× (2400×1350px).</div>

  <div class="panel">
    <div class="field">
      <label for="tipo">Tipo de card</label>
      <select id="tipo">
        <option value="previa">1 · Prévia da rodada</option>
        <option value="zebra">2 · Zebra de um jogo</option>
        <option value="ranking">3 · Ranking de zebras da rodada</option>
        <option value="status">4 · Status semanal</option>
      </select>
    </div>
    <div class="field" id="jogoField" hidden>
      <label for="jogo">Jogo</label>
      <select id="jogo"></select>
    </div>
    <button class="btn secondary" id="btnRefresh" type="button">Atualizar preview</button>
    <button class="btn" id="btnDown" type="button">Baixar imagem (PNG)</button>
  </div>

  <div class="stagearea">
    <div class="stage">
      <div class="cardbox" id="cardbox"></div>
      <div class="meta" id="cardMeta"></div>
    </div>
    <div class="stage dlpreview" id="dlStage" hidden>
      <div class="meta" style="margin-top:0 0 8px">Arquivo gerado (clique com o botão direito para salvar):</div>
      <img id="dlImg" alt="PNG exportado">
    </div>
  </div>
</div>

<script>
const DATA = {"season":2026,"current_round":26,"total_rounds":38,"updated":"2026-09-07","zebras_rodada":[{"date":"2026-09-06","round":26,"mandante":"Corinthians","visitante":"Chapecoense","placar":"1-2","probabilidade":0.2156},{"date":"2026-09-06","round":26,"mandante":"Botafogo","visitante":"Palmeiras","placar":"0-0","probabilidade":0.2689},{"date":"2026-09-06","round":26,"mandante":"Internacional","visitante":"Santos","placar":"2-3","probabilidade":0.314},{"date":"2026-09-06","round":26,"mandante":"Coritiba","visitante":"Mirassol","placar":"1-2","probabilidade":0.3334},{"date":"2026-09-05","round":26,"mandante":"Bragantino","visitante":"Bahia","placar":"2-3","probabilidade":0.3479},{"date":"2026-09-05","round":26,"mandante":"São Paulo","visitante":"Atlético-MG","placar":"2-0","probabilidade":0.3835},{"date":"2026-09-07","round":26,"mandante":"Vitória","visitante":"Grêmio","placar":"1-0","probabilidade":0.4309},{"date":"2026-09-06","round":26,"mandante":"Cruzeiro","visitante":"Athletico-PR","placar":"3-1","probabilidade":0.4817},{"date":"2026-09-06","round":26,"mandante":"Clube do Remo","visitante":"Flamengo","placar":"0-1","probabilidade":0.5236},{"date":"2026-09-06","round":26,"mandante":"Fluminense","visitante":"Vasco da Gama","placar":"1-0","probabilidade":0.5754}],"proxima_rodada":[{"round":21,"data":"2026-07-29","mandante":"São Paulo","visitante":"Santos","favorito":"visitante","prob_zebra":0.429},{"round":21,"data":"2026-07-29","mandante":"Chapecoense","visitante":"Vasco da Gama","favorito":"visitante","prob_zebra":0.4047},{"round":21,"data":"2026-07-29","mandante":"Atlético-MG","visitante":"Bragantino","favorito":"mandante","prob_zebra":0.2649},{"round":21,"data":"2026-09-16","mandante":"Botafogo","visitante":"Grêmio","favorito":"mandante","prob_zebra":0.2279}],"ritmo":{"2023":[3,6,9,12,15,15,18,21,21,24,27,30,33,36,39,40,43,44,47,48,51,51,51,51,52,55,58,59,60,60,60,60,60,62,63,66,69,70],"2024":[3,6,7,9,10,13,14,17,19,21,24,24,27,30,31,33,36,39,40,41,43,43,46,48,50,53,56,57,60,61,64,67,68,69,70,73,76,79],"2025":[3,4,7,10,13,14,16,19,22,22,24,27,30,30,33,36,39,40,43,46,49,50,53,54,57,58,58,61,64,64,67,68,71,71,74,75,78,79],"2026":[3,6,7,10,13,16,17,19,22,25,26,29,32,33,34,35,38,41,44,44,47,48,48,51,52,54]},"cenarios":[{"team":"Flamengo","titulo_confirmado":false,"titulo_descartado":false,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":true},{"team":"Palmeiras","titulo_confirmado":false,"titulo_descartado":false,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":true},{"team":"Fluminense","titulo_confirmado":false,"titulo_descartado":false,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":true},{"team":"Cruzeiro","titulo_confirmado":false,"titulo_descartado":false,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":true},{"team":"Bahia","titulo_confirmado":false,"titulo_descartado":false,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":true},{"team":"Botafogo","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":false},{"team":"Athletico-PR","titulo_confirmado":false,"titulo_descartado":false,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":true},{"team":"Atlético-MG","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":false},{"team":"Mirassol","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":false},{"team":"Santos","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":false},{"team":"São Paulo","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":false},{"team":"Vitória","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":false},{"team":"Bragantino","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":false},{"team":"Corinthians","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":false},{"team":"Grêmio","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":false},{"team":"Coritiba","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":false,"z4_confirmado":false,"z4_descartado":false},{"team":"Internacional","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":true,"z4_confirmado":false,"z4_descartado":false},{"team":"Vasco da Gama","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":true,"z4_confirmado":false,"z4_descartado":false},{"team":"Clube do Remo","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":true,"z4_confirmado":false,"z4_descartado":false},{"team":"Chapecoense","titulo_confirmado":false,"titulo_descartado":true,"g4_confirmado":false,"g4_descartado":true,"z4_confirmado":false,"z4_descartado":false}]}; /*__DATA__*/

/* paleta fixa (tema claro do site) — o card sempre exporta igual,
   independente do tema em que o navegador de quem gera a imagem está */
const C = {
  bg:'#F1F2EF', surface:'#FFFFFF', surface2:'#F8F9F6',
  line:'#E2E5DF', line2:'#CBD0C8',
  ink:'#13161A', ink2:'#4B545A', ink3:'#646B71', ink4:'#7C858B',
  accent:'#0D6A50', accentSoft:'#E1EFE9',
  blue:'#2A5E9E', blueSoft:'#E3EAF4',
  red:'#BC3A2B', redSoft:'#F7E6E3',
  amber:'#8F6410', amberSoft:'#F4EDDB',
};
const W = 1200, H = 675;
const FSANS = 'Archivo, system-ui, sans-serif';
const FSERIF = '"Instrument Serif", Georgia, serif';

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct1 = v => (v * 100).toFixed(1).replace('.', ',') + '%';
const pct0 = v => Math.round(v * 100) + '%';
const MESES_C = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmtShort = iso => { const [,m,d] = iso.split('-'); return `${+d} ${MESES_C[+m-1]}`; };

/* casco comum: fundo, wordmark no canto superior esquerdo, atribuição
   no canto inferior direito (funciona como marca d'água quando o print
   circula sem o link do post) */
function shell(inner, tag){
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${FSANS}">
    <rect width="${W}" height="${H}" fill="${C.bg}"/>
    <rect x="0" y="0" width="${W}" height="6" fill="${C.accent}"/>
    <g>
      <rect x="56" y="46" width="30" height="30" rx="7" fill="${C.accent}"/>
      <text x="71" y="67" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">FS</text>
      <text x="96" y="68" font-size="17" font-weight="700" fill="${C.ink}">FORA DA SÚMULA</text>
    </g>
    <text x="${W-56}" y="${H-40}" text-anchor="end" font-size="13.5" font-weight="600" fill="${C.ink3}">foradasumula.com.br</text>
    ${tag ? `<rect x="${W-56-tag.w}" y="46" width="${tag.w}" height="30" rx="15" fill="${C.surface2}" stroke="${C.line}"/>
      <text x="${W-56-tag.w/2}" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="${C.ink2}">${esc(tag.label)}</text>` : ''}
    ${inner}
  </svg>`;
}

function tagFor(round){
  const label = `BRASILEIRÃO ${DATA.season} · RODADA ${round}`;
  return {label, w: 26 + label.length * 7.6};
}

/* -------------------- 1. prévia da rodada -------------------- */
function renderPrevia(){
  const fixtures = DATA.proxima_rodada;
  const round = fixtures[0] ? fixtures[0].round : DATA.current_round + 1;
  let y = 150;
  let rows = '';
  fixtures.slice(0, 4).forEach(f => {
    rows += `<text x="56" y="${y}" font-size="22" font-weight="700" fill="${C.ink}">${esc(f.mandante)}</text>
      <text x="330" y="${y}" font-size="16" fill="${C.ink4}">vs</text>
      <text x="368" y="${y}" font-size="22" font-weight="700" fill="${C.ink}">${esc(f.visitante)}</text>
      <text x="${W-56}" y="${y}" text-anchor="end" font-size="14" fill="${C.ink3}">${esc(fmtShort(f.data))}</text>`;
    y += 52;
  });

  const top = fixtures.slice().sort((a,b) => b.prob_zebra - a.prob_zebra)[0];
  const zebra = top.favorito === 'mandante' ? top.visitante : top.mandante;
  const fav = top.favorito === 'mandante' ? top.mandante : top.visitante;
  const boxY = y + 24;

  const inner = `
    <text x="56" y="118" font-size="15" font-weight="700" fill="${C.blue}" letter-spacing="1.5">PRÉVIA DA RODADA</text>
    ${rows}
    <rect x="56" y="${boxY}" width="${W-112}" height="118" rx="12" fill="${C.redSoft}"/>
    <text x="80" y="${boxY+38}" font-size="13.5" font-weight="700" fill="${C.red}" letter-spacing="1">ZEBRA PROVÁVEL</text>
    <text x="80" y="${boxY+78}" font-size="26" font-weight="700" fill="${C.ink}">${esc(zebra)} pode surpreender o ${esc(fav)}</text>
    <text x="80" y="${boxY+104}" font-size="15" fill="${C.ink2}">${pct1(top.prob_zebra)} de chance de vitória do azarão, segundo o modelo de força (Elo)</text>
  `;
  return {svg: shell(inner, tagFor(round)), name: `previa-rodada-${round}.png`};
}

/* -------------------- 2. zebra de um jogo -------------------- */
function renderZebra(idx){
  const g = DATA.zebras_rodada[idx] ?? DATA.zebras_rodada[0];
  const inner = `
    <text x="56" y="118" font-size="15" font-weight="700" fill="${C.red}" letter-spacing="1.5">ZEBRA CONFIRMADA</text>
    <text x="56" y="270" font-size="64" font-weight="700" font-family="${FSERIF}" fill="${C.ink}">${esc(g.mandante)} ${esc(g.placar.split('-')[0])}–${esc(g.placar.split('-')[1])} ${esc(g.visitante)}</text>
    <text x="56" y="320" font-size="16" fill="${C.ink3}">${esc(fmtShort(g.date))} · rodada ${g.round}</text>
    <rect x="56" y="380" width="360" height="150" rx="14" fill="${C.surface}" stroke="${C.line}"/>
    <text x="82" y="422" font-size="13.5" font-weight="700" fill="${C.ink3}" letter-spacing="1">PROBABILIDADE PRÉ-JOGO</text>
    <text x="82" y="490" font-size="52" font-weight="700" font-family="${FSERIF}" fill="${C.red}">${pct1(g.probabilidade)}</text>
    <text x="440" y="422" font-size="15.5" fill="${C.ink2}" width="600">de chance para o resultado que</text>
    <text x="440" y="448" font-size="15.5" fill="${C.ink2}">saiu em campo — segundo o modelo</text>
    <text x="440" y="474" font-size="15.5" fill="${C.ink2}">de força por Elo antes da bola rolar.</text>
  `;
  return {svg: shell(inner, tagFor(g.round)), name: `zebra-${g.mandante}-${g.visitante}.png`.toLowerCase().replace(/\s+/g,'-')};
}

/* -------------------- 3. ranking de zebras da rodada -------------------- */
function renderRanking(){
  const list = DATA.zebras_rodada.slice(0, 6);
  const round = list[0] ? list[0].round : DATA.current_round;
  let y = 158;
  let rows = '';
  list.forEach((g, i) => {
    rows += `
      <text x="56" y="${y}" font-size="24" font-weight="700" fill="${C.ink4}">${i+1}</text>
      <text x="96" y="${y}" font-size="19" font-weight="600" fill="${C.ink}">${esc(g.mandante)} ${esc(g.placar)} ${esc(g.visitante)}</text>
      <text x="${W-56}" y="${y}" text-anchor="end" font-size="19" font-weight="700" fill="${C.red}">${pct1(g.probabilidade)}</text>
      <line x1="56" y1="${y+16}" x2="${W-56}" y2="${y+16}" stroke="${C.line}" stroke-width="1"/>
    `;
    y += 68;
  });
  const inner = `
    <text x="56" y="118" font-size="15" font-weight="700" fill="${C.red}" letter-spacing="1.5">TOP ZEBRAS DA RODADA</text>
    ${rows}
  `;
  return {svg: shell(inner, tagFor(round)), name: `ranking-zebras-rodada-${round}.png`};
}

/* -------------------- 4. status semanal -------------------- */
function renderStatus(){
  const cen = DATA.cenarios;
  const cat = (a,b) => cen.filter(c => c[a] || c[b]);
  const groups = [
    {label:'Título confirmado', key:'titulo_confirmado', color:C.accent, soft:C.accentSoft},
    {label:'Título descartado', key:'titulo_descartado', color:C.ink3, soft:C.surface2},
    {label:'G4 descartado', key:'g4_descartado', color:C.ink3, soft:C.surface2},
    {label:'Z4 confirmado (rebaixado)', key:'z4_confirmado', color:C.red, soft:C.redSoft},
    {label:'Fora do Z4 (salvo)', key:'z4_descartado', color:C.accent, soft:C.accentSoft},
  ].map(g => ({...g, teams: cen.filter(c => c[g.key]).map(c => c.team)}))
   .filter(g => g.teams.length);

  let y = 150;
  let left = `<text x="56" y="118" font-size="15" font-weight="700" fill="${C.blue}" letter-spacing="1.5">CENÁRIOS DA RODADA ${DATA.current_round}</text>`;
  groups.slice(0, 4).forEach(g => {
    const names = g.teams.slice(0, 3).join(', ') + (g.teams.length > 3 ? ` +${g.teams.length - 3}` : '');
    left += `<rect x="56" y="${y}" width="7" height="40" rx="3" fill="${g.color}"/>
      <text x="76" y="${y+16}" font-size="13" font-weight="700" fill="${g.color}">${esc(g.label.toUpperCase())} (${g.teams.length})</text>
      <text x="76" y="${y+36}" font-size="15.5" fill="${C.ink2}">${esc(names)}</text>`;
    y += 58;
  });

  /* ritmo do líder: temporada corrente vs as 3 anteriores, mesmo eixo de rodada */
  const seasons = Object.keys(DATA.ritmo).sort();
  const curSeason = String(DATA.season);
  const cur = DATA.ritmo[curSeason] || [];
  const others = seasons.filter(s => s !== curSeason);
  const maxN = Math.max(...seasons.map(s => DATA.ritmo[s].length));
  const maxV = Math.max(...seasons.flatMap(s => DATA.ritmo[s]));
  const cx = 700, cw = 440, cy0 = 150, ch = 230;
  const px = i => cx + i / (maxN - 1) * cw;
  const pv = v => cy0 + ch - v / maxV * ch;
  const line = (arr, color, dim) => {
    const pts = arr.map((v,i) => `${px(i).toFixed(1)},${pv(v).toFixed(1)}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${dim?2:3}" opacity="${dim?0.55:1}"/>`;
  };
  let chart = `<text x="${cx}" y="118" font-size="15" font-weight="700" fill="${C.ink3}" letter-spacing="1">RITMO DO LÍDER</text>`;
  chart += `<line x1="${cx}" y1="${cy0+ch}" x2="${cx+cw}" y2="${cy0+ch}" stroke="${C.line}" stroke-width="1"/>`;
  others.forEach(s => chart += line(DATA.ritmo[s], C.ink4, true));
  chart += line(cur, C.accent, false);
  const lastI = cur.length - 1;
  chart += `<circle cx="${px(lastI).toFixed(1)}" cy="${pv(cur[lastI]).toFixed(1)}" r="5" fill="${C.accent}"/>`;
  chart += `<text x="${px(lastI).toFixed(1)}" y="${(pv(cur[lastI])-14).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="700" fill="${C.accent}">${cur[lastI]} pts</text>`;

  const prevSeason = others[others.length-1];
  const prevAtSame = DATA.ritmo[prevSeason] && DATA.ritmo[prevSeason][lastI] != null ? DATA.ritmo[prevSeason][lastI] : null;
  let compareTxt = '';
  if (prevAtSame != null){
    const diff = cur[lastI] - prevAtSame;
    compareTxt = `<text x="${cx}" y="${cy0+ch+42}" font-size="14.5" fill="${C.ink2}">Na rodada ${lastI+1}, o campeão de ${prevSeason} tinha ${prevAtSame} pts (${diff>=0?'+':''}${diff} de diferença hoje).</text>`;
  }

  const inner = `${left}${chart}${compareTxt}`;
  return {svg: shell(inner), name: `status-semanal-rodada-${DATA.current_round}.png`};
}

const RENDERERS = {previa: renderPrevia, zebra: () => renderZebra(+document.getElementById('jogo').value), ranking: renderRanking, status: renderStatus};

function populateJogoSelect(){
  const sel = document.getElementById('jogo');
  sel.innerHTML = DATA.zebras_rodada.map((g,i) => `<option value="${i}">${esc(g.mandante)} ${esc(g.placar)} ${esc(g.visitante)} — ${pct1(g.probabilidade)}</option>`).join('');
}

let currentResult = null;
function draw(){
  const tipo = document.getElementById('tipo').value;
  document.getElementById('jogoField').hidden = tipo !== 'zebra';
  currentResult = RENDERERS[tipo]();
  document.getElementById('cardbox').innerHTML = currentResult.svg;
  document.getElementById('cardMeta').textContent = `1200×675px · ${currentResult.name}`;
  document.getElementById('dlStage').hidden = true;
}

async function download(){
  if (!currentResult) return;
  await (document.fonts && document.fonts.ready);
  const scale = 2;
  const svgBlob = new Blob([currentResult.svg], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = currentResult.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    document.getElementById('dlImg').src = dataUrl;
    document.getElementById('dlStage').hidden = false;
  };
  img.src = url;
}

document.getElementById('tipo').addEventListener('change', draw);
document.getElementById('jogo').addEventListener('change', draw);
document.getElementById('btnRefresh').addEventListener('click', draw);
document.getElementById('btnDown').addEventListener('click', download);

populateJogoSelect();
draw();
</script>
</body>
</html>
